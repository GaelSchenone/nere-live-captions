<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtítulos — N.E.R.E</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --panel-bg: #16181d;
      --panel-border: #2a2d34;
      --accent: #2c6e49;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0c0f;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
    }
    #topbar .field {
      flex: 1 1 140px;
      min-width: 110px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #topbar label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9aa1af;
    }
    #topbar select {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      background: #0b0c0f;
      color: #eee;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
    }

    #stage {
      flex: 1 1 auto;
      min-height: 0;
      background: var(--bg);
      display: flex;
    }
    #caption {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 16px;
      text-align: left;
      line-height: 1.5;
      color: var(--fg);
    }
    #caption.muted { color: #6b7280; display: flex; align-items: center; justify-content: center; text-align: center; }
    #caption .caption-line { padding: 0.2em 0; }
    #caption .caption-line:last-child { font-weight: 700; }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="field">
      <label for="session_select">Charla</label>
      <select id="session_select"></select>
    </div>
    <div class="field">
      <label for="lang_select">Idioma</label>
      <select id="lang_select">
        <option value="es">Español</option>
        <option value="en">Inglés</option>
        <option value="original">Original (sin traducir)</option>
      </select>
    </div>
    <div class="field">
      <label for="font_select">Fuente</label>
      <select id="font_select">
        <option value="system">Sans (sistema)</option>
        <option value="serif">Serif</option>
        <option value="monospace">Monoespaciada</option>
        <option value="display">Display / impacto</option>
        <option value="dyslexic">Legible (OpenDyslexic-like)</option>
      </select>
    </div>
  </div>

  <div id="stage"><div id="caption" class="muted">Elegí una charla para ver los subtítulos.</div></div>

  <script src="/assets/captions-ws.js"></script>
  <script>
    const FONT_STACKS = {
      system: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
      serif: 'Georgia, "Times New Roman", serif',
      monospace: 'Menlo, Monaco, "Courier New", monospace',
      display: 'Impact, "Arial Black", sans-serif',
      // Sans humanista con letras bien diferenciadas -- ayuda a lectores con
      // dislexia sin necesitar bajar una fuente aparte (OpenDyslexic real no
      // esta instalada por defecto en casi ningun sistema).
      dyslexic: 'Verdana, "Comic Sans MS", sans-serif',
    };
    const FONT_STORAGE_KEY = 'nere_audience_font_v1';

    const sessionSelect = document.getElementById('session_select');
    const langSelect = document.getElementById('lang_select');
    const fontSelect = document.getElementById('font_select');
    const captionEl = document.getElementById('caption');
    let captionsHandle = null;
    let currentStyle = null; // ultimo audience_style que mando el servidor

    const params = new URLSearchParams(location.search);

    // ---------- Fuente: eleccion personal de quien lee, no del operador ----------
    function applyFont() {
      const saved = localStorage.getItem(FONT_STORAGE_KEY);
      const family = saved || (currentStyle && currentStyle.font_family) || 'system';
      fontSelect.value = family;
      captionEl.style.fontFamily = FONT_STACKS[family] || FONT_STACKS.system;
    }
    fontSelect.addEventListener('change', () => {
      try { localStorage.setItem(FONT_STORAGE_KEY, fontSelect.value); } catch (e) {}
      applyFont();
    });

    // ---------- Estilo que manda el operador (color, fondo, tamaño, contorno) ----------
    function applyStyle(s) {
      currentStyle = s;
      applyFont();
      captionEl.style.color = s.text_color;
      captionEl.style.fontSize = s.font_size + 'px';
      captionEl.style.webkitTextStroke = s.outline_enabled ? `1px ${s.outline_color}` : '';
      const stage = document.getElementById('stage');
      stage.style.background = s.bg_mode === 'solid' ? s.bg_color : '#0b0c0f';
      captionEl.style.background = s.bg_mode === 'behind_text' ? s.bg_color : 'transparent';
    }

    async function loadSessions() {
      const res = await fetch('/api/sessions');
      const sessions = await res.json();
      const current = sessionSelect.value;
      sessionSelect.innerHTML = sessions.map(s =>
        `<option value="${s.id}">${s.name} (${s.status})</option>`
      ).join('');
      if (params.get('session') && !current) {
        sessionSelect.value = params.get('session');
      } else if (current) {
        sessionSelect.value = current;
      }
    }

    const MAX_LINES = 300; // tope para no acumular infinito en una charla larga

    function appendCaption(data) {
      const lang = langSelect.value;
      const text = lang === 'original' ? data.original : (data.translations[lang] || data.original);
      if (!captionEl.querySelector('.caption-line')) captionEl.textContent = ''; // saca "Esperando audio..."
      captionEl.classList.remove('muted');

      const div = document.createElement('div');
      div.className = 'caption-line';
      div.textContent = `- ${text}`;
      captionEl.appendChild(div);
      while (captionEl.children.length > MAX_LINES) captionEl.removeChild(captionEl.firstChild);
      captionEl.scrollTop = captionEl.scrollHeight; // siempre mostrar la linea nueva, historial arriba
    }

    function connect() {
      if (captionsHandle) captionsHandle.stop();
      const sessionId = sessionSelect.value;
      if (!sessionId) return;
      captionEl.classList.add('muted');
      captionEl.textContent = '';
      captionsHandle = connectCaptions(sessionId, (data) => {
        if (data.type === 'audience_style') applyStyle(data);
        else if (data.type === 'caption') appendCaption(data);
      }, (status) => {
        if (status === 'connected' && !captionEl.children.length) {
          captionEl.textContent = 'Conectado. Esperando audio...';
        } else if (status !== 'connected') {
          captionEl.classList.add('muted');
        }
      });
    }

    sessionSelect.addEventListener('change', connect);
    langSelect.addEventListener('change', () => {}); // el proximo mensaje ya usa el nuevo idioma

    (async () => {
      await loadSessions();
      if (sessionSelect.value) connect();
      setInterval(loadSessions, 8000);
    })();
  </script>
</body>
</html>
