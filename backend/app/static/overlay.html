<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtítulos</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 3vh 4vw;
      box-sizing: border-box;
      background: transparent;
    }
    #caption {
      display: inline-block;
      text-align: center;
      line-height: 1.25;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      word-wrap: break-word;
      max-width: 100%;
      padding: 0.1em 0.3em;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="stage"><div id="caption">Esperando subtítulos...</div></div>

  <script src="/assets/captions-ws.js"></script>
  <script>
    // Ventana puramente de display -- todo el control (sesion aparte, idioma,
    // color, fondo, contorno) llega del servidor via /ws/captions, que lo
    // manda el dashboard del operador. No tiene ajustes propios: asi funciona
    // igual dentro de un navegador normal que dentro del Browser Source de
    // OBS (que corre un Chromium embebido aparte -- un BroadcastChannel o
    // localStorage del navegador normal nunca le llegaria).
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('session');
    const stage = document.getElementById('stage');
    const captionEl = document.getElementById('caption');

    const FONT_STACKS = {
      system: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
      serif: 'Georgia, "Times New Roman", serif',
      monospace: 'Menlo, Monaco, "Courier New", monospace',
      display: 'Impact, "Arial Black", sans-serif',
    };

    let style = null;
    let lastCaption = null;

    function applyStyle() {
      if (!style) return;
      captionEl.style.fontFamily = FONT_STACKS[style.font_family] || FONT_STACKS.system;
      captionEl.style.color = style.text_color;
      captionEl.style.fontSize = style.font_size + 'px';
      captionEl.style.webkitTextStroke = style.outline_enabled ? `2px ${style.outline_color}` : '';

      document.body.style.background = style.bg_mode === 'solid' ? style.bg_color : 'transparent';
      captionEl.style.background = style.bg_mode === 'behind_text' ? style.bg_color : 'transparent';
    }

    function renderCaption() {
      if (!lastCaption || !style) return;
      const lang = style.lang;
      const text = lang === 'original' ? lastCaption.original : (lastCaption.translations[lang] || lastCaption.original);
      captionEl.textContent = text;
    }

    function connect() {
      if (!sessionId) {
        captionEl.textContent = 'Falta ?session=ID en la URL';
        return;
      }
      connectCaptions(sessionId, (data) => {
        if (data.type === 'overlay_style') {
          style = data;
          applyStyle();
          renderCaption();
        } else if (data.type === 'caption') {
          lastCaption = data;
          renderCaption();
        }
      }, (status) => {
        if (status === 'connected' && !lastCaption) captionEl.textContent = '';
      });
    }
    connect();
  </script>
</body>
</html>
